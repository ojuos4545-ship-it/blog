<!doctype html><html lang="ko"><head><meta charset="utf-8"></head><body>
<div class="canvas">
  <div class="head"><span class="no">START</span><span class="title">명령어가 실행되는 흐름</span></div>
  <div class="flow">
    <div class="node"><span class="num">1</span><b>명령어 파일</b><small>폴더에 저장</small></div>
    <div class="arrow">→</div>
    <div class="node"><span class="num">2</span><b>/이름 입력</b><small>인자도 함께</small></div>
    <div class="arrow">→</div>
    <div class="node"><span class="num">3</span><b>클로드 실행</b><small>본문 지시 수행</small></div>
  </div>
  <div class="key">
    <div class="label">KEY POINT</div>
    <div class="big">파일 이름이 곧 명령어 이름</div>
    <div class="small">하위 폴더는 폴더:이름 형태</div>
  </div>
</div>
</body></html>
