<!doctype html><html lang="ko"><head><meta charset="utf-8"></head><body>
<div class="canvas">
  <div class="head"><span class="no">01</span><span class="title">시작은 4단계면 충분합니다</span></div>
  <div class="flow vflow">
    <div class="node"><span class="num">1</span><b>열기</b><small>터미널 창</small></div>
    <div class="arrow">↓</div>
    <div class="node"><span class="num">2</span><b>설치</b><small>명령 한 줄</small></div>
    <div class="arrow">↓</div>
    <div class="node"><span class="num">3</span><b>로그인</b><small>브라우저 인증</small></div>
    <div class="arrow">↓</div>
    <div class="node"><span class="num">4</span><b>질문</b><small>말하듯 입력</small></div>
  </div>
  <div class="key">
    <div class="label">KEY POINT</div>
    <div class="big">명령어 암기 없이 말로 부탁</div>
  </div>
</div>
<style>.vflow{flex-direction:column;gap:6px}
.vflow .node{width:100%;flex-direction:row;justify-content:flex-start;gap:28px;padding:18px 36px;text-align:left}
.vflow .node b{font-size:44px;min-width:170px}
.vflow .arrow{font-size:44px;line-height:1}</style>
</body></html>
