<!doctype html><html lang="ko"><head><meta charset="utf-8"></head><body>
<div class="canvas">
  <div class="head"><span class="no">01</span><span class="title">멈추는 키 4가지 차이</span></div>
  <table>
    <tr><th style="width:250px">단축키</th><th class="ok" style="width:260px">하는 일</th><th class="no">주의점</th></tr>
    <tr><td><code>Esc</code></td><td>응답 중단</td><td>해 둔 작업은 유지</td></tr>
    <tr><td><code>Esc</code> 두 번</td><td>입력 지우기</td><td>빈 입력창은 되감기</td></tr>
    <tr><td><code>Ctrl+C</code></td><td>작업 중단</td><td>두 번이면 종료</td></tr>
    <tr><td><code>Ctrl+D</code></td><td>종료</td><td>두 번 눌러야 종료</td></tr>
  </table>
  <div class="key">
    <div class="label">KEY POINT</div>
    <div class="big">멈출 땐 Ctrl+C보다 Esc</div>
    <div class="small">이전 질문 다시 쓰기는 ↑ 또는 <code>Ctrl+R</code></div>
  </div>
</div>
</body></html>
